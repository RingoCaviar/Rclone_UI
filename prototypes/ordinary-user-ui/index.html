<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rclone UI interaction prototype</title>
  <style>
    :root{color-scheme:dark;--bg:#101113;--panel:#181a1f;--panel2:#20232a;--line:#30343c;--text:#f5f6f8;--muted:#aab0bb;--accent:#6cb6ff;--good:#65d69e;--warn:#ffc857;--danger:#ff7b72;--radius:12px;font:14px/1.45 "Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-width:920px}button,input{font:inherit}button{color:inherit}.app{min-height:100vh;padding-bottom:84px}.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#29313d;color:var(--accent);font-weight:700}.muted{color:var(--muted)}.badge{padding:3px 8px;border-radius:999px;background:#253244;color:#a9d4ff;font-size:12px}.good{color:var(--good)}.warn{color:var(--warn)}.danger{color:var(--danger)}.primary,.soft,.ghost{border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.primary{background:#0f6cbd;color:#fff}.soft{background:#2a313c}.ghost{background:transparent}.primary:hover,.soft:hover,.ghost:hover{filter:brightness(1.18)}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.progress{height:7px;border-radius:9px;background:#303640;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit}.row{display:flex;align-items:center;gap:12px}.between{display:flex;align-items:center;justify-content:space-between;gap:14px}.stack{display:grid;gap:12px}h1,h2,h3,p{margin-top:0}h1{font-size:27px;margin-bottom:4px}h2{font-size:18px}h3{font-size:15px;margin-bottom:6px}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#15171b}.brand{font-weight:650;font-size:16px}.avatar{width:30px;height:30px;border-radius:50%;background:#335d87;display:grid;place-items:center}.switcher{position:fixed;z-index:99;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;background:#f5f5f5;color:#111;box-shadow:0 10px 35px #0009}.switcher button{width:38px;height:34px;border:0;border-radius:999px;background:#ddd;cursor:pointer}.switcher strong{min-width:230px;text-align:center}.prototype-state{position:fixed;right:18px;bottom:18px;padding:7px 10px;border:1px solid #56606e;border-radius:8px;background:#17191d;color:#b9c0ca;font:11px Consolas,monospace}
    /* A: task home */
    .a-shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px)}.a-side{border-right:1px solid var(--line);padding:18px 12px;background:#14161a}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;padding:10px 12px;border-radius:8px;background:transparent;color:var(--muted)}.nav button.active{background:#253143;color:#fff}.a-main{padding:26px 30px;max-width:1300px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.quick .card{min-height:112px;cursor:pointer}.a-grid{display:grid;grid-template-columns:minmax(500px,1.6fr) minmax(280px,1fr);gap:18px}.task{padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.remote{padding:12px;border-radius:10px;background:var(--panel2)}
    /* B: guided workspace */
    .b-wrap{max-width:1180px;margin:auto;padding:30px}.b-hero{padding:28px;border-radius:16px;background:linear-gradient(125deg,#183a5b,#252943 70%,#35284c);border:1px solid #3c5270}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.step{position:relative;padding-top:56px;min-height:185px}.step-num{position:absolute;left:18px;top:18px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#304763}.b-section{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.timeline{border-left:2px solid #3b4655;margin-left:8px;padding-left:22px}.event{position:relative;margin-bottom:22px}.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);left:-28px;top:5px}
    /* C: dual pane */
    .c-toolbar{height:54px;padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px}.c-toolbar input{flex:1;min-width:300px;border:1px solid var(--line);border-radius:8px;background:#202329;color:#fff;padding:0 12px}.c-main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);height:calc(100vh - 170px)}.pane{background:var(--bg);padding:14px}.crumb{height:42px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}.filehead,.file{display:grid;grid-template-columns:1fr 100px 150px;gap:10px;padding:9px 10px}.filehead{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.file{border-radius:7px}.file:hover,.file.selected{background:#263447}.c-queue{height:58px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#17191d}.transfer-arrow{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);z-index:4;width:42px;height:42px;border-radius:50%;border:1px solid #536171;background:#202733;color:#fff}
  </style>
</head>
<body>
  <main id="root" class="app"></main>
  <div class="switcher" role="navigation" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><strong id="variant-label"></strong><button id="next" aria-label="Next variant">→</button></div>
  <output id="prototype-state" class="prototype-state" aria-live="polite"></output>
  <script>
    const variants={A:'任务主页 · Task home',B:'引导工作台 · Guided workspace',C:'双栏浏览器 · Dual-pane explorer'};
    const remotes=`<div class="stack"><div class="remote between"><div class="row"><span class="icon">OD</span><div><strong>OneDrive</strong><div class="muted">工作文件 · 286 GB 可用</div></div></div><span class="good">● 在线</span></div><div class="remote between"><div class="row"><span class="icon">S3</span><div><strong>Archive S3</strong><div class="muted">备份存储 · 加密</div></div></div><span class="good">● 在线</span></div><div class="remote between"><div class="row"><span class="icon">GD</span><div><strong>Google Drive</strong><div class="muted">个人文件</div></div></div><span class="warn">需重新授权</span></div></div>`;
    const tasks=`<div class="task"><div class="between"><strong>照片增量备份</strong><span>68%</span></div><div class="muted">D:\\Pictures → OneDrive:/Photos</div><div class="progress"><i style="width:68%"></i></div><small class="muted">42.8 MB/s · 约 3 分钟</small></div><div class="task"><div class="between"><strong>工作文档同步</strong><span class="good">已完成</span></div><div class="muted">Documents ↔ OneDrive:/Work</div><small class="muted">今天 08:42 · 1,284 个文件</small></div>`;
    function header(){return `<header class="top"><div class="row"><span class="icon">R</span><span class="brand">Rclone UI</span><span class="badge">便携版</span></div><div class="row"><button class="ghost">🔔</button><div class="avatar">V</div></div></header>`}
    function A(){return `${header()}<div class="a-shell"><aside class="a-side"><nav class="nav"><button class="active">⌂　主页</button><button>☁　远程存储</button><button>↔　传输任务</button><button>▣　文件浏览</button><button>◉　挂载</button><button>◷　计划任务</button><button>☷　活动与日志</button><button>⚙　设置</button></nav></aside><section class="a-main"><div class="between"><div><h1>早上好</h1><p class="muted">所有存储均正常，1 个任务正在运行。</p></div><button class="primary" data-action="创建传输任务">＋ 新建任务</button></div><div class="quick"><article class="card"><div class="icon">↔</div><h3>复制或同步</h3><span class="muted">创建传输任务</span></article><article class="card"><div class="icon">▣</div><h3>浏览文件</h3><span class="muted">跨存储管理文件</span></article><article class="card"><div class="icon">◉</div><h3>挂载磁盘</h3><span class="muted">作为 Windows 驱动器</span></article><article class="card"><div class="icon">＋</div><h3>添加远程存储</h3><span class="muted">连接云端或服务器</span></article></div><div class="a-grid"><article class="card"><div class="between"><h2>传输活动</h2><button class="ghost">查看全部</button></div>${tasks}</article><article class="card"><div class="between"><h2>远程存储</h2><button class="ghost">管理</button></div>${remotes}</article></div></section></div>`}
    function B(){return `${header()}<div class="b-wrap"><section class="b-hero"><span class="badge">开始使用</span><h1>今天想完成什么？</h1><p>按照三个清晰步骤连接存储、选择文件，然后安全执行。高级选项始终可用，但不会挡住第一次使用。</p><button class="primary" data-action="开始引导任务">开始新的文件操作　→</button></section><section class="steps"><article class="card step"><span class="step-num">1</span><h2>选择存储</h2><p class="muted">本机、OneDrive、S3 或其他 rclone 后端。</p><button class="soft">管理连接</button></article><article class="card step"><span class="step-num">2</span><h2>选择操作</h2><p class="muted">复制、移动、同步或挂载，并用通俗语言解释差异。</p><button class="soft">比较操作</button></article><article class="card step"><span class="step-num">3</span><h2>预览并运行</h2><p class="muted">先 dry-run 查看影响，再确认执行，避免意外删除。</p><button class="soft">查看安全说明</button></article></section><div class="b-section"><article class="card"><div class="between"><h2>继续最近的工作</h2><button class="ghost">任务历史</button></div>${tasks}</article><article class="card"><h2>今天的动态</h2><div class="timeline"><div class="event"><strong>工作文档同步完成</strong><div class="muted">08:42 · 无错误</div></div><div class="event"><strong>OneDrive 令牌即将过期</strong><div class="muted">点击重新授权</div></div><div class="event"><strong>有新版本可用</strong><div class="muted">rclone 1.XX · 已验证</div></div></div></article></div></div>`}
    function files(side){const rows=side==='local'?['📁 Photos','📁 Documents','📁 Projects','📄 todo.txt']:['📁 Camera Uploads','📁 Work','📁 Shared','📄 welcome.pdf'];return rows.map((x,i)=>`<div class="file ${i===1?'selected':''}"><span>${x}</span><span>${i<3?'—':'24 KB'}</span><span>${i===1?'今天 08:30':'昨天'}</span></div>`).join('')}
    function C(){return `${header()}<div class="c-toolbar"><button class="soft">←</button><button class="soft">→</button><button class="soft">↑</button><input value="搜索当前两个位置" aria-label="Search"><button class="primary" data-action="创建双栏传输">传输所选</button><button class="soft">⋯</button></div><div class="c-main"><section class="pane"><div class="between"><strong>此电脑</strong><span class="badge">源</span></div><div class="crumb">D:\ 用户文件</div><div class="filehead"><span>名称</span><span>大小</span><span>修改时间</span></div>${files('local')}</section><button class="transfer-arrow" data-action="切换传输方向">⇄</button><section class="pane"><div class="between"><strong>OneDrive</strong><span class="badge">目标</span></div><div class="crumb">OneDrive:/</div><div class="filehead"><span>名称</span><span>大小</span><span>修改时间</span></div>${files('remote')}</section></div><footer class="c-queue"><div><strong>照片增量备份</strong>　<span class="muted">D:\\Pictures → OneDrive:/Photos</span></div><div class="row"><div class="progress" style="width:220px"><i style="width:68%"></i></div><strong>68%</strong><button class="soft">任务队列</button></div></footer>`}
    const renderers={A,B,C};
    function current(){const value=new URLSearchParams(location.search).get('variant')?.toUpperCase();return variants[value]?value:'A'}
    function render(){const key=current();document.querySelector('#root').innerHTML=renderers[key]();document.querySelector('#variant-label').textContent=`${key} — ${variants[key]}`;document.querySelector('#prototype-state').textContent=`variant=${key} · persistence=memory · backend=stub`;document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>document.querySelector('#prototype-state').textContent=`variant=${key} · action=${el.dataset.action} · result=simulated`))}
    function cycle(delta){const keys=Object.keys(variants),index=keys.indexOf(current()),next=keys[(index+delta+keys.length)%keys.length],url=new URL(location.href);url.searchParams.set('variant',next);history.replaceState({},'',url);render()}
    document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});addEventListener('popstate',render);render();
  </script>
</body>
</html>
