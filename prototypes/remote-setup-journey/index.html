<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote setup journey prototype</title>
<style>
:root{color-scheme:dark;--bg:#0f1114;--side:#15171b;--panel:#1a1d22;--panel2:#21252c;--line:#30353e;--text:#f4f6f8;--muted:#a9b0bb;--accent:#69b7ff;--good:#5fd19a;--warn:#ffc857;--danger:#ff746c;font:14px/1.45 "Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-width:980px}button,input,select{font:inherit}button{color:inherit;cursor:pointer}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#14161a}.row{display:flex;align-items:center;gap:11px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo,.provider-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#26394d;color:#9ed1ff;font-weight:700}.brand{font-size:16px;font-weight:650}.badge{padding:3px 8px;border-radius:999px;background:#263446;color:#b9dcff;font-size:12px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px);padding-bottom:80px}.side{padding:18px 12px;border-right:1px solid var(--line);background:var(--side)}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;padding:10px 12px;border-radius:8px;background:transparent;color:var(--muted)}.nav button.active{background:#263348;color:#fff}.content{padding:26px 30px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.muted{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.danger{color:var(--danger)}h1,h2,h3,p{margin-top:0}h1{font-size:26px;margin-bottom:4px}h2{font-size:18px}h3{font-size:15px}.primary,.soft,.ghost,.danger-btn{border:0;border-radius:8px;padding:9px 14px}.primary{background:#0f6cbd;color:#fff}.soft{background:#2a3039}.ghost{background:transparent}.danger-btn{background:#512a2d;color:#ffb4af}.field{display:grid;gap:6px;margin:13px 0}.field input,.field select{height:40px;padding:0 11px;border:1px solid #414853;border-radius:8px;background:#14171b;color:#fff}.switcher{position:fixed;z-index:100;bottom:17px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;background:#f4f4f4;color:#111;box-shadow:0 12px 35px #000a}.switcher button{width:38px;height:34px;border:0;border-radius:50%;background:#ddd}.switcher strong{min-width:260px;text-align:center}.state{position:fixed;z-index:99;right:18px;bottom:18px;max-width:330px;padding:8px 11px;border:1px solid #526070;border-radius:8px;background:#17191d;color:#c2cad4;font:11px Consolas,monospace}.providers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.provider{padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);cursor:pointer}.provider.selected{outline:2px solid var(--accent);background:#21364b}.steps{display:flex;gap:7px;margin:22px 0}.step{flex:1;padding:10px;border-bottom:3px solid #343943;color:var(--muted)}.step.active{border-color:var(--accent);color:#fff}.layout-a{display:grid;grid-template-columns:1fr 300px;gap:18px}.summary{position:sticky;top:20px}.check{padding:10px;border-radius:8px;background:#20262d;margin:8px 0}.scenario-tabs{display:flex;gap:6px;margin:16px 0}.scenario-tabs button.active{background:#315276}.chat{max-width:850px;margin:auto}.bubble{max-width:72%;padding:14px 16px;border-radius:15px;margin:12px 0;background:#242931}.bubble.user{margin-left:auto;background:#173f61}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.choice{text-align:left;padding:15px;border:1px solid var(--line);border-radius:10px;background:#1d2127}.assistant-bar{display:flex;gap:8px;margin-top:20px}.assistant-bar input{flex:1;height:42px;border:1px solid var(--line);border-radius:9px;background:#171a1f;color:#fff;padding:0 12px}.studio{display:grid;grid-template-columns:260px 1fr 320px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:600px}.studio>section{background:var(--panel);padding:17px}.remote-item{padding:12px;border-radius:8px;margin-bottom:6px;background:#23272e}.remote-item.active{background:#263b50}.option{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;margin:11px 0}.option input,.option select{height:38px;border:1px solid #414853;border-radius:7px;background:#15181d;color:#fff;padding:0 10px}.code{white-space:pre-wrap;padding:13px;border-radius:8px;background:#101216;color:#a9d8a9;font:12px Consolas,monospace}.notice{padding:12px;border-left:3px solid var(--warn);background:#2c291f;border-radius:6px}.testline{padding:10px 0;border-bottom:1px solid var(--line)}
</style></head><body><main id="root"></main><div class="switcher"><button id="prev">←</button><strong id="label"></strong><button id="next">→</button></div><output class="state" id="state" aria-live="polite"></output>
<script>
const variants={A:'提供商向导 · Provider wizard',B:'目标问答 · Guided conversation',C:'配置工作台 · Config studio'};let model={provider:'OneDrive',step:1,scenario:'add',auth:'not-started',test:'not-run',dirty:false};
const header=()=>`<header class="top"><div class="row"><span class="logo">R</span><span class="brand">Rclone UI</span><span class="badge">便携版</span></div><div class="row"><span class="good">● Background Host 正常</span><button class="ghost">帮助</button></div></header>`;
const shell=body=>`${header()}<div class="shell"><aside class="side"><nav class="nav"><button>⌂　主页</button><button class="active">☁　远程存储</button><button>↔　传输任务</button><button>▣　文件浏览</button><button>◉　挂载</button><button>◷　计划任务</button><button>☷　活动与日志</button><button>⚙　设置</button></nav></aside><section class="content">${body}</section></div>`;
const scenarioTabs=()=>`<div class="scenario-tabs"><button class="soft ${model.scenario==='add'?'active':''}" data-scenario="add">新增</button><button class="soft ${model.scenario==='repair'?'active':''}" data-scenario="repair">修复授权</button><button class="soft ${model.scenario==='manage'?'active':''}" data-scenario="manage">管理与导出</button></div>`;
function VariantA(){let body;if(model.scenario==='repair')body=repairA();else if(model.scenario==='manage')body=manageA();else body=addA();return shell(`<div class="between"><div><h1>远程存储</h1><p class="muted">连接云存储、对象存储或服务器。</p></div><button class="primary" data-action="new">＋ 添加 Remote</button></div>${scenarioTabs()}${body}`)}
function addA(){return `<div class="steps"><div class="step ${model.step===1?'active':''}">1　选择提供商</div><div class="step ${model.step===2?'active':''}">2　登录与设置</div><div class="step ${model.step===3?'active':''}">3　测试并保存</div></div><div class="layout-a"><section class="card"><h2>${model.step===1?'你要连接到哪里？':model.step===2?'连接 '+model.provider:'确认连接'}</h2>${model.step===1?providerGrid():model.step===2?authForm():testPanel()}<div class="between" style="margin-top:18px"><button class="soft" data-action="back">上一步</button><button class="primary" data-action="next">${model.step===3?'保存 Remote':'继续'}</button></div></section><aside class="card summary"><h3>设置摘要</h3><div class="check">提供商<br><strong>${model.provider}</strong></div><div class="check">名称<br><strong>${model.provider} - 个人</strong></div><div class="check">授权<br><span class="${model.auth==='complete'?'good':'muted'}">${model.auth==='complete'?'已完成':'等待中'}</span></div><button class="ghost">显示高级选项</button></aside></div>`}
function providerGrid(){return `<div class="providers">${['OneDrive','Google Drive','S3','Dropbox','SFTP','WebDAV','本地目录','其他'].map((p,i)=>`<div class="provider ${model.provider===p?'selected':''}" data-provider="${p}"><span class="provider-icon">${i<4?p.slice(0,2):'+'}</span><h3>${p}</h3><span class="muted">${p==='其他'?'全部 rclone 后端':'推荐设置'}</span></div>`).join('')}</div>`}
function authForm(){return `<div class="notice">将在浏览器中打开 ${model.provider} 官方登录页面。Rclone UI 不会看到你的账户密码。</div><div class="field"><label>Remote 名称</label><input value="${model.provider} - 个人"></div><button class="primary" data-action="auth">在浏览器中授权</button><details style="margin-top:14px"><summary>无法打开浏览器或使用远程电脑？</summary><p class="muted">显示 rclone 的替代授权步骤和一次性输入框。</p></details>`}
function testPanel(){return `<div class="testline between"><span>✓ 授权信息可解密</span><span class="good">通过</span></div><div class="testline between"><span>✓ 连接 Remote</span><span class="good">通过</span></div><div class="testline between"><span>✓ 列出根目录</span><span class="${model.test==='passed'?'good':'muted'}">${model.test==='passed'?'通过':'等待测试'}</span></div><button class="soft" data-action="test">重新测试</button>`}
function repairA(){return `<div class="layout-a"><section class="card"><div class="between"><div class="row"><span class="provider-icon">GD</span><div><h2>Google Drive</h2><span class="warn">授权已过期</span></div></div><span class="badge">需要操作</span></div><p>最近失败：令牌刷新被提供商拒绝。已有任务已暂停，不会自动删除或重建 Remote。</p><div class="testline">1　重新授权（保留名称、路径和任务引用）</div><div class="testline">2　测试根目录与能力</div><div class="testline">3　恢复暂停的计划</div><button class="primary" data-action="reauth">重新授权并测试</button> <button class="soft" data-action="diagnostics">查看诊断</button></section><aside class="card"><h3>安全恢复</h3><p class="muted">修复不会创建第二个 Remote，也不会改动引用它的任务。</p><button class="danger-btn" data-action="delete">删除 Remote…</button></aside></div>`}
function manageA(){return `<div class="layout-a"><section class="card"><div class="between"><div class="row"><span class="provider-icon">OD</span><div><h2>OneDrive - 个人</h2><span class="good">● 已连接</span></div></div><button class="soft" data-action="test">测试连接</button></div><div class="field"><label>显示名称</label><input value="OneDrive - 个人"></div><div class="field"><label>配置方式</label><select><option>推荐设置</option><option>高级 rclone 选项</option></select></div><button class="primary" data-action="save">保存更改</button></section><aside class="card"><h3>导入与导出</h3><button class="soft" data-action="import">导入 rclone 配置</button> <button class="soft" data-action="export">导出加密备份</button><hr style="border-color:var(--line)"><h3 class="danger">危险区域</h3><p class="muted">删除前列出受影响的任务与 Mount。</p><button class="danger-btn" data-action="delete">删除 Remote…</button></aside></div>`}
function VariantB(){return shell(`<div class="chat"><h1>连接助手</h1><p class="muted">告诉我你想连接什么，助手每次只问一个必要问题。</p>${scenarioTabs()}<div class="bubble">${model.scenario==='repair'?'Google Drive 的授权已过期。我可以保留所有任务并重新授权。':model.scenario==='manage'?'你想管理哪个已连接的 Remote？':'你想把文件连接到哪里？'}</div>${model.scenario==='add'?`<div class="choices"><button class="choice" data-provider="OneDrive"><strong>常用云盘</strong><br><span class="muted">OneDrive、Google Drive、Dropbox</span></button><button class="choice" data-provider="S3"><strong>对象存储</strong><br><span class="muted">Amazon S3 及兼容服务</span></button><button class="choice" data-provider="SFTP"><strong>服务器或 NAS</strong><br><span class="muted">SFTP、WebDAV、SMB 网关</span></button><button class="choice" data-provider="其他"><strong>其他存储</strong><br><span class="muted">搜索全部 rclone 后端</span></button></div><div class="bubble user">我选择了：${model.provider}</div><div class="bubble">好的。我会先使用推荐设置。你可以稍后展开高级选项。下一步将在官方页面授权。</div>`:model.scenario==='repair'?`<div class="bubble user">保留现有任务并修复</div><div class="bubble">修复顺序：重新授权 → 测试连接 → 恢复计划。任何一步失败都会保留旧配置。</div><button class="primary" data-action="reauth">开始安全修复</button>`:`<div class="choices"><button class="choice" data-action="edit"><strong>修改设置</strong><br><span class="muted">保留任务引用</span></button><button class="choice" data-action="test"><strong>测试连接</strong><br><span class="muted">检查授权和根目录</span></button><button class="choice" data-action="export"><strong>导出备份</strong><br><span class="muted">保持加密</span></button><button class="choice" data-action="delete"><strong class="danger">删除</strong><br><span class="muted">先检查使用关系</span></button></div>`}<div class="assistant-bar"><input placeholder="搜索提供商或输入问题"><button class="primary" data-action="send">继续</button></div></div>`)}
function VariantC(){return shell(`<div class="between"><div><h1>Remote 配置工作台</h1><p class="muted">完整控制 rclone 后端选项、授权状态和导入导出。</p></div><button class="primary" data-action="save">应用配置</button></div>${scenarioTabs()}<div class="studio"><section><h3>Remotes</h3><div class="remote-item active"><strong>OneDrive - 个人</strong><br><span class="good">● 正常</span></div><div class="remote-item"><strong>Google Drive</strong><br><span class="warn">● 需授权</span></div><button class="soft" data-action="new">＋ 新建</button><hr style="border-color:var(--line)"><button class="ghost" data-action="import">导入 rclone.conf</button><button class="ghost" data-action="export">导出加密备份</button></section><section><h2>${model.scenario==='repair'?'修复 Google Drive':'编辑 OneDrive - 个人'}</h2><div class="option"><label>后端类型</label><select><option>onedrive</option><option>drive</option><option>s3</option></select></div><div class="option"><label>Remote 名称</label><input value="OneDrive - 个人"></div><div class="option"><label>drive_type</label><select><option>personal</option><option>business</option></select></div><div class="option"><label>chunk_size</label><select><option>10 MiB（默认）</option><option>50 MiB</option></select></div><div class="notice">敏感字段仅显示状态，不回显令牌。后端新增选项会通过运行时能力发现。</div><h3 style="margin-top:20px">授权与测试</h3><button class="soft" data-action="reauth">重新授权</button> <button class="soft" data-action="test">运行诊断测试</button></section><section><h3>实时配置摘要</h3><div class="code">[OneDrive - 个人]\ntype = onedrive\ndrive_type = personal\ntoken = &lt;encrypted&gt;\n\ncapabilities:\n  copy: true\n  move: true\n  hashes: quickxor</div><h3 style="margin-top:18px">使用关系</h3><p>3 个任务 · 1 个计划 · 0 个 Mount</p><button class="danger-btn" data-action="delete">删除并查看影响…</button></section></div>`)}
const renderers={A:VariantA,B:VariantB,C:VariantC};function current(){let k=new URLSearchParams(location.search).get('variant')?.toUpperCase();return variants[k]?k:'A'}
function paint(action='render'){let k=current();document.querySelector('#root').innerHTML=renderers[k]();document.querySelector('#label').textContent=`${k} — ${variants[k]}`;wire();showState(action)}
function showState(action){document.querySelector('#state').textContent=`variant=${current()} · scenario=${model.scenario} · provider=${model.provider} · step=${model.step} · auth=${model.auth} · test=${model.test} · action=${action}`}
function wire(){document.querySelectorAll('[data-provider]').forEach(x=>x.onclick=()=>{model.provider=x.dataset.provider;model.dirty=true;paint('select-provider')});document.querySelectorAll('[data-scenario]').forEach(x=>x.onclick=()=>{model.scenario=x.dataset.scenario;paint('change-scenario')});document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>act(x.dataset.action))}
function act(a){if(a==='next'){if(model.step<3)model.step++;else model.dirty=false}if(a==='back')model.step=Math.max(1,model.step-1);if(['auth','reauth'].includes(a))model.auth='complete';if(a==='test')model.test='passed';paint(a)}
function cycle(d){let ks=Object.keys(variants),i=ks.indexOf(current()),n=ks[(i+d+ks.length)%ks.length],u=new URL(location.href);u.searchParams.set('variant',n);history.replaceState({},'',u);paint()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});addEventListener('popstate',paint);paint();
</script></body></html>
